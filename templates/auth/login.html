<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — E-Hotel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fas fa-hotel"></i></div>
      <h1>E-Hotel</h1>
      <p>Welcome Back</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
    <div class="alert alert-{{ cat }}"><i class="fas fa-info-circle"></i> {{ msg }}</div>
    {% endfor %}{% endif %}{% endwith %}

    <form method="post" action="{{ url_for('customer_login') }}">
      <div class="form-group">
        <label class="form-label"><i class="fas fa-envelope" style="color:var(--accent);margin-right:6px;"></i>Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="you@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label"><i class="fas fa-lock" style="color:var(--accent);margin-right:6px;"></i>Password</label>
        <div style="position:relative;">
          <input type="password" class="form-control" name="password" id="loginPassword" placeholder="Your password" required style="padding-right:44px;">
          <button type="button" onclick="togglePwd('loginPassword',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text2);font-size:.9rem;" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;font-size:.85rem;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-footer" style="margin-top:22px;">
      Don't have an account? <a href="{{ url_for('customer_signup') }}" style="color:var(--accent-dark);font-weight:600;">Sign Up</a>
    </div>
    <div class="auth-footer mt-2">
      <a href="{{ url_for('index') }}" style="color:var(--text2);font-size:.82rem;">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
<script>
function togglePwd(id, btn) {
  var inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.innerHTML = '<i class="fas fa-eye-slash"></i>'; }
  else { inp.type = 'password'; btn.innerHTML = '<i class="fas fa-eye"></i>'; }
}
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
